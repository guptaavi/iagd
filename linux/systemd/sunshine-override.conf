[Service]
Environment=DISPLAY=:0

# Wait for a display that is actually USABLE, not merely for the X socket to appear.
#
# The previous condition was `[ -S /tmp/.X11-unix/X0 ]`, which is satisfied the instant Xorg
# starts listening - long before xorg-headless has finished configuring an output. Sunshine then
# probed for a display, found none, and failed EVERY encoder in turn:
#
#     Trying encoder [nvenc] ... failed     [vulkan] failed  [vaapi] failed  [software] failed
#     Fatal: Unable to find display or encoder during startup.
#
# It then kept running with no encoder at all, so every app launch spun for a few seconds and
# quit. Nothing in that failure mentions the real cause, and a restart once X is up fixes it,
# which makes it look intermittent rather than ordered.
#
# Grepping for '*' waits for an output with an ACTIVE MODE, which is the thing Sunshine actually
# needs. 90 tries because mode setup at boot has taken ~36s here, and losing the encoder is far
# worse than starting late.
ExecStartPre=
ExecStartPre=/bin/bash -c 'for i in $(seq 1 90); do [ -S /tmp/.X11-unix/X0 ] && DISPLAY=:0 xrandr 2>/dev/null | grep -q "\*" && exit 0; sleep 1; done; exit 1'
