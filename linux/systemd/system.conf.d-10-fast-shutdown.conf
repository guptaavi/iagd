# A reboot of this box once took SEVEN AND A HALF MINUTES to reach shutdown.target, and had to be
# finished by hand at the machine. The journal showed why: orphaned winedevice.exe processes from
# past Grim Dawn sessions, each parked in its own session scope, each granted the full 90s default
# before SIGKILL - plus nvidia-persistenced timing out the same way.
#
# 15s is long enough for anything here to exit cleanly and short enough that a pile of stuck
# processes cannot turn a reboot into an unattended-server problem.
#
# It does NOT help against the other blocker seen that night: an Xorg left dead-but-unreapable by
# the NVIDIA driver survives SIGKILL entirely ("Processes still around after final SIGKILL"), and
# no timeout can shorten that.
[Manager]
DefaultTimeoutStopSec=15s
